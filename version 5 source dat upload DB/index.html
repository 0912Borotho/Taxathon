<style>
/* Layout: one column that widens on desktop. A top bar switches between Assist (traders, and the staff who

:root{

  --bad:#b3261e;--bad-bg:#fbe5e3;
  --display:"Source Serif 4",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191e;--surface:#162329;--ink:#e5edef;--muted:#93a6ad;--line:#263840;
  --accent:#4fc3c3;--accent-ink:#0b1a1a;--accent-soft:#183a3b;
  --ready:#5fcf94;--ready-bg:#16322480;--check:#f0a54a;--check-bg:#3a2a1480;--decide:#8fa8f0;--decide-bg:#1d2a4c80;
  --bad:#f2877f;--bad-bg:#40191780;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191e;--surface:#162329;--ink:#e5edef;--muted:#93a6ad;--line:#263840;
  --accent:#4fc3c3;--accent-ink:#0b1a1a;--accent-soft:#183a3b;
  --ready:#5fcf94;--ready-bg:#16322480;--check:#f0a54a;--check-bg:#3a2a1480;--decide:#8fa8f0;--decide-bg:#1d2a4c80;
  --bad:#f2877f;--bad-bg:#40191780;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.menu{position:absolute;right:0;top:100%;margin-top:6px;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:12px;z-index:20}

.ptitle{font:700 18px var(--display)}

/* tabs */

.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}

label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.btn.pri[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.result{border-left:5px solid var(--c);background:var(--cb);border-radius:6px;padding:12px 14px;margin-top:14px}

<div class="wrap">
<header class="top">
  <div class="hbar"><div class="brand">Mohoebi<small>PLATFORM</small></div><div class="icons" id="icons"></div></div>
</header>
<p class="notice">Practice data only. This prototype for the RSL Taxathon is not connected to any RSL system, and no real taxpayer appears in it.</p>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main>
    <section id="assist" aria-label="Mohoebi Assist"><div id="aview"></div></section>

  </main>
</div>
</div>

  <div class="pbar"><button class="ib back" data-act="closepanel" aria-label="Close" style="min-width:48px;min-height:48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><b class="ptitle" id="ptitle"></b></div>
  <div id="pbody"></div>
</div>

<script>
/* Mohoebi matching engine, in JavaScript. A line-for-line port of mohoebi_engine.py so the page can work out the lists from the six source files in the browser.
   Input: records from the six places (and, optionally, an answer key). Output: the data the page shows. */
const MO_TYPES=['general dealer','tuck shop','mini market','butchery','hardware','snack bar','tavern','hair salon','tailoring','car wash','guesthouse','phone repairs'];
const MO_TYPE_WORDS=new Set(MO_TYPES.flatMap(t=>t.split(' ')));
const MO_AREAS=['Thetsane','Qoaling','Lithoteng','Khubetsoana','Ha Abia','Ha Matala','Motimposo','Maseru West'];
const MO_NEIGH={};MO_AREAS.forEach((a,i)=>{MO_NEIGH[a]=MO_AREAS[(i+1)%MO_AREAS.length]});
const MO_STOP=new Set(['shop','store','trading','the','and','ltd','pty','s']);
const MO_SRC_ORDER=['register','wholesaler','mpesa','ecocash','licence','lec','wasco','canvass'];
const MO_CAT={register:'register',wholesaler:'wholesalers',mpesa:'mobile money',ecocash:'mobile money',licence:'licences',lec:'utility accounts',wasco:'utility accounts',canvass:'field agents'};
const MO_TYPE_SECTOR={general:'retail',tuck:'retail',mini:'retail',snack:'snack bar',tavern:'tavern',butchery:'butchery',hardware:'hardware',hair:'services',tailoring:'services',car:'services',guesthouse:'services',phone:'services'};
const MO_LIC_SECTOR={'General Dealer Licence':'retail','Snack Bar Licence':'snack bar','Liquor Licence':'tavern','Butchery and Livestock Permit':'butchery','Services Trading Licence':'services','Guesthouse Licence':'services'};
const MO_WS_SECTOR={'Maluti Beverage Distributors':'tavern','Berea Meat Wholesalers':'butchery','Lesotho Builders Supply':'hardware'};
const MO_FIXED_BAND={busy:20000,moderate:9000,quiet:3000,closed:0};
const MO_SECTORS=['retail','snack bar','tavern','butchery','hardware','services'];
const MO_SECTOR_LABEL={retail:'shops','snack bar':'snack bars',tavern:'taverns',butchery:'butcheries',hardware:'hardware shops',services:'service businesses'};
const MO_PLACES=[
 ['register','RSL register','Revenue Services Lesotho','Who is already registered. Used to take registered businesses off the list.','RSL already holds it.',['register']],
 ['wholesalers','Wholesalers','VAT-registered wholesalers (example names)','Which shops buy stock in bulk, and roughly how much each month.','RSL asks wholesalers for a monthly list of their business customers and what each bought.',['wholesaler']],
 ['mobile','Mobile money','Vodacom Lesotho (M-Pesa) and Econet Telecom Lesotho (EcoCash)','Which businesses take customer payments on a merchant account, and how much comes in each month.','A data-sharing agreement with each provider.',['mpesa','ecocash']],

/* ---------- Assist: check my business ---------- */
function vCheck(){
  const r=drafts.res,e=drafts.chkErr;
  let out=`<div class="box"><h1 class="lead">${esc(t('chk_title'))}</h1><p class="sub">${esc(t('chk_sub'))}</p>

  <div class="two-col"><div><label for="c-day">${esc(t('q_day'))}</label><input id="c-day" type="number" inputmode="decimal" min="0" data-draft="chk.day" value="${dval('chk','day','400')}"></div>
  <div><label for="c-days">${esc(t('q_days'))}</label><select id="c-days" data-draft="chk.days">${[1,2,3,4,5,6,7].map(n=>`<option${String(dget('chk','days','6'))===String(n)?' selected':''}>${n}</option>`).join('')}</select></div></div>
  <label for="c-tin">${esc(t('q_tin'))}</label>
  <select id="c-tin" data-draft="chk.tin">${[['yes','yes'],['no','no'],['unsure','unsure']].map(([v,k])=>`<option value="${v}"${dget('chk','tin','no')===v?' selected':''}>${esc(t(k))}</option>`).join('')}</select>
  ${e?`<div class="err" role="alert">${esc(e)}</div>`:''}
  <div class="btns"><button class="btn pri" id="c-go" data-act="calc">${esc(t('btn_see'))}</button></div></div>`;
  if(r){
    const k=r.m>=THRESH?'above':r.m>=THRESH*.5?'close':'below';
    const col=k==='above'?G.ready:k==='close'?G.check:G.decide;
    out+=`<div class="box"><div class="result" style="--c:${col.c};--cb:${col.b}"><h3>${esc(t('res_'+k))}</h3>
      <p class="mono" style="font-size:14px">${esc(t('calc',{d:fmt(r.day),n:r.days,m:fmt(r.m)}))}</p>
      <p>${esc(t('do_'+k))}</p><p class="note">${esc(t('lvl',{x:fmt(THRESH)}))}</p></div>
      <div class="btns">${k!=='below'?`<button class="btn pri" data-act="showref">${esc(t('btn_help'))}</button>`:''}<button class="btn" data-act="atab" data-k="nb">${esc(t('btn_nb'))}</button></div>`;
    if(drafts.showRef&&!drafts.refDone){
      const re=drafts.refErr;
      out+=`<div class="dec"><label for="r-name">${esc(t('f_name'))}</label><input id="r-name" type="text" autocomplete="name" data-draft="ref.name" value="${dval('ref','name','')}">
      <div class="two-col"><div><label for="r-phone">${esc(t('f_phone'))}</label><input id="r-phone" type="tel" inputmode="tel" autocomplete="tel" data-draft="ref.phone" value="${dval('ref','phone','')}"></div>
      <div><label for="r-area">${esc(t('f_area'))}</label><select id="r-area" data-draft="ref.area"><option value="">—</option>${AREAS.map(a=>`<option${dget('ref','area','')===a?' selected':''}>${esc(a)}</option>`).join('')}</select></div></div>
      <label for="r-lang">${esc(t('f_lang'))}</label><select id="r-lang" data-draft="ref.lang"><option value="Sesotho"${dget('ref','lang',S.lang==='st'?'Sesotho':'English')==='Sesotho'?' selected':''}>Sesotho</option><option value="English"${dget('ref','lang',S.lang==='st'?'Sesotho':'English')==='English'?' selected':''}>English</option></select>
      <label class="check" for="r-consent"><input id="r-consent" type="checkbox" data-draft="ref.consent"${dget('ref','consent',false)?' checked':''}><span>${esc(t('f_consent'))}</span></label>
      ${re?`<div class="err" role="alert">${esc(re)}</div>`:''}
      <div class="btns"><button class="btn pri" data-act="sendref">${esc(t('btn_send'))}</button></div></div>`;
    }
    if(drafts.refDone)out+=`<div class="ok" role="status">${esc(t('ref_ok'))}</div>`;
    out+='</div>';
  }
  return out;
}

const STEPS=['Greet the trader and confirm who owns the business and what it sells','Check the name and phone against the record, in case it is already registered under another name','Ask how customers pay and what records are kept today','Explain what registering means and what the trader needs to keep','Get the trader’s consent to share details with RSL','Show the notebook and set the reminder language'];
const OUT={pack:'Registration pack ready (trader agreed)',already:'Already registered under another name',closed:'Closed or not trading',later:'Not ready yet, follow up later',declined:'Declined'};
function visits(){
  const r=S.referrals.map(x=>({id:x.id,name:x.name,area:x.area,phone:x.phone,src:'Asked for help',est:x.est,lang:x.lang,reasons:['Asked for help on the Check my business page','Estimated sales: about M'+fmt(x.est)+' a month, from what the trader said']}));
  const a=Object.keys(S.decisions).filter(id=>S.decisions[id].action==='visit'&&WORK[id]).map(id=>{const w=WORK[id];return {id,name:w.name,area:w.area,phone:w.phone,src:'Approved by an officer',est:w.est,lang:'To ask',reasons:w.reasons.slice(1,5)}});
  return r.concat(a);
}
function packText(v,o){return ['REGISTRATION PACK (practice data, not sent to RSL)','Business: '+v.name,'Area: '+v.area,'Phone: '+v.phone,'Estimated sales: about M'+fmt(v.est)+' a month','Language: '+(v.lang||'To ask'),'Agent checks: all six steps done','Trader consent to share details: yes','Prepared: '+o.t,'','This pack does not register anyone. Submit it through RSL’s usual registration channel.'].join('\n')}
function vAgent(){
  const all=visits(),todo=all.filter(v=>!S.outcomes[v.id]);

    <label for="o-${v.id}">Result of the visit</label><select id="o-${v.id}" data-draft="o_${v.id}.out"><option value="">Choose a result</option>${Object.entries(OUT).map(([k,l])=>`<option value="${k}"${oc===k?' selected':''}>${esc(l)}</option>`).join('')}</select>

function cardW(w){
  const g=G[w.group],d=S.decisions[w.id],o=open.has(w.id);
  let h=`<div class="card" id="c-${w.id}" style="--c:${g.c};--cb:${g.b}"><button class="head" data-act="toggle" data-id="${w.id}" aria-expanded="${o}"><span class="stripe"></span>

  <span class="side"><span class="score">${w.score}<small>/100</small></span><span class="pill">${g.l}</span>${d?`<span class="pill" style="--c:var(--accent);--cb:var(--accent-soft)">${DEC[d.action]}</span>`:''}</span></button>`;
  if(o){
    const dr=drafts['d_'+w.id]||(drafts['d_'+w.id]={action:d?d.action:'',reason:d?d.reason:'',note:d?d.note:''});

    <h3 class="k">Names in the records</h3><ul>${(w.names||[]).map(x=>`<li><b>${esc(x[0])}:</b> ${esc(x[1])}</li>`).join('')}</ul><h3 class="k">Suggested next step</h3><div>${esc(w.action)}</div>
    <div class="dec"><b style="font-size:14px">Your decision</b><div class="btns" style="margin-top:8px">${[['visit','Approve visit'],['review','Send to review'],['dismiss','Dismiss']].map(([k,l])=>`<button class="btn${k==='visit'?' pri':''}" data-act="dact" data-id="${w.id}" data-v="${k}" aria-pressed="${dr.action===k}">${l}</button>`).join('')}</div>
    ${dr.action==='dismiss'?`<label for="dr-${w.id}">Reason (required)</label><select id="dr-${w.id}" data-draft="d_${w.id}.reason"><option value="">Choose a reason</option>${REASONS.map(r=>`<option${dr.reason===r?' selected':''}>${esc(r)}</option>`).join('')}</select>`:''}
    ${dr.action==='visit'&&w.group!=='ready'?`<p class="note">This business is not in the Ready to visit group, so a short reason is required.</p>`:''}
    <label for="dn-${w.id}">Note${dr.action==='visit'&&w.group!=='ready'?' (required)':' (optional)'}</label><input id="dn-${w.id}" type="text" data-draft="d_${w.id}.note" value="${esc(dr.note)}">
    ${er?`<div class="err" role="alert">${esc(er)}</div>`:''}
    <div class="btns"><button class="btn pri" data-act="dsave" data-id="${w.id}">Save decision</button></div>

    ${S.showKey&&hasKey()?`<div class="key"><b>Real answer (practice data):</b> ${esc(w.truth)}${w.merged?' · two different businesses were mixed into one here':''}</div>`:''}</div>`;
  }
  return h+'</div>';
}

  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error('The Excel reader could not be loaded. Use CSV files instead.'))};document.head.appendChild(s)});
  return xlsxP}
let sqlP=null;
function loadSql(){if(window.initSqlJs)return Promise.resolve();
  if(!sqlP)sqlP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';s.onload=res;s.onerror=()=>{sqlP=null;rej(new Error('The database reader could not be loaded. Export the tables as CSV and upload those instead.'))};document.head.appendChild(s)});
  return sqlP}
async function readDb(buf){await loadSql();const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f});
  const db=new SQL.Database(new Uint8Array(buf)),out=[];
  const tn=db.exec("SELECT name FROM sqlite_master WHERE type IN ('table','view')");
  for(const r of (tn[0]?tn[0].values:[])){const name=r[0],q=db.exec('SELECT * FROM "'+String(name).replace(/"/g,'""')+'"');
    if(!q[0])continue;const cols=q[0].columns;out.push({name,rows:q[0].values.map(v=>Object.fromEntries(cols.map((c,i)=>[c,v[i]===null?'':v[i]])))})}
  db.close();return out}
async function handleFiles(files){
  drafts.up={busy:true};render();
  try{
    const tables={},warnings=[];
    for(const f of files){const nm=f.name.toLowerCase();
      if(nm.endsWith('.csv')){const rows=moParseCSV(await f.text()),k=moClassify(rows);if(k)tables[k]=rows;else warnings.push(f.name+' was not recognised and was skipped.')}
      else if(nm.endsWith('.xlsx')||nm.endsWith('.xls')){await loadXlsx();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
        for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}),k=moClassify(rows);if(k)tables[k]=rows;else if(sn!=='README')warnings.push(f.name+', sheet "'+sn+'" was not recognised and was skipped.')}}
      else if(/\.(db|sqlite3?)$/.test(nm)){for(const t_ of await readDb(await f.arrayBuffer())){const k=moClassify(t_.rows);if(k)tables[k]=t_.rows;else warnings.push(f.name+', table "'+t_.name+'" was not recognised and was skipped.')}}
      else warnings.push(f.name+': only CSV, Excel and database (.db) files can be read.')}
    const got=Object.keys(tables).filter(k=>MO_KINDS[k]).map(k=>MO_KINDS[k].label);
    const merged=Object.assign({},baseTables(),tables);
    const b=moBuildInput(merged);
    if(b.problems.length){drafts.up={problems:b.problems,warnings:warnings.concat(b.warnings)};render();return}
    await new Promise(r=>setTimeout(r,30));
    const nd=mohoebiRun(b.input);curTables=merged;setData(nd,true);
    log('Demo officer','Own data','Loaded own files',nd.work.length+' businesses listed');
    drafts.up={warnings:warnings.concat(b.warnings),done:'Done. '+(got.length?'Replaced: '+got.join(', ')+'. The other places stay as they were. ':'')+nd.work.length+' businesses listed ('+nd.metrics.ordinary+' ready to visit) and '+nd.nil.length+' nil-return filers.'+(nd.hasKey?' Tested against your answer key.':' There is no answer key, so How well it works shows counts only.')};
    render();
  }catch(e){drafts.up={problems:['Something went wrong while reading the files: '+(e&&e.message?e.message:e)]};render()}
}

   log('Demo officer',w.name,DEC[dr.action],(dr.reason?dr.reason+(note?' · ':''):'')+note);drafts['de_'+id]='';save();render();toast(DEC[dr.action]+'.')},
 nact(b){const id=b.dataset.id,dr=drafts['n_'+id]||(drafts['n_'+id]={});dr.action=b.dataset.v;drafts['ne_'+id]='';render()},
 nsave(b){const id=b.dataset.id,n=D.nil.find(x=>x.id===id),dr=drafts['n_'+id]||{};
   if(!dr.action){drafts['ne_'+id]='Choose what to do with this case.';render();return}
   S.nilDecisions[id]={action:dr.action,note:(dr.note||'').trim(),t:stamp()};
   log('Demo officer',n.name,NACT[dr.action],(dr.note||'').trim());drafts['ne_'+id]='';save();render();toast(NACT[dr.action]+'.')},
 login(){const l=drafts.lg||{},ph=String(l.phone===undefined?'+266 5812 3456':l.phone).replace(/\D/g,'');
   if(ph.length<7){drafts.loginErr='Enter a phone number with at least 7 digits.';render();return}
   if(String(l.code||'').trim()!=='1234'){drafts.loginErr='The practice code is 1234.';render();return}
   doLogin(String(l.phone===undefined?'+266 5812 3456':l.phone).trim())},
 demologin(){doLogin()},
 logout(){S.user=null;drafts.panel=null;save();render();toast('Signed out.')},
 paneltoggle(b){const v=b.dataset.v;drafts.panel=drafts.panel===v?null:v;drafts.payErr='';drafts.detErr='';render()},
 paynow(){const p=drafts.pay||{},ph=String(p.phone===undefined?S.user.phone:p.phone).replace(/\D/g,'');
   if(ph.length<7){drafts.payErr='Enter the phone number you are paying from.';render();return}
   const m=p.method||'M-Pesa',ref='PRAC-'+(1000+S.seq++);S.obl=Object.assign({},S.obl,{status:'paid',method:m,ref,paidAt:stamp()});
   log('Trader (demo)',USER.name,'Paid tax (practice)','M'+fmt(OBL.amount)+' by '+m+', receipt '+ref);drafts.panel=null;drafts.payErr='';save();render();toast('Payment recorded (practice).')},
 query(){const q=((drafts.q||{}).text||'').trim();if(!q){drafts.qErr='Say what looks wrong.';render();return}
   S.obl=Object.assign({},S.obl,{query:q});log('Trader (demo)',USER.name,'Asked RSL to review obligation',q);drafts.qErr='';save();render();toast('Sent to RSL (practice).')},
 detsave(){const d=drafts.det||{};if(!d.ok){drafts.detErr='Tick the box to say the details are correct.';render();return}
   S.profile={updated:ymd(new Date()),area:d.area||S.profile.area,line:d.line||S.profile.line,phone:String(d.phone===undefined?S.profile.phone:d.phone).trim()||S.profile.phone};
   log('Trader (demo)',USER.name,'Updated business details','');drafts.det={};drafts.panel=null;drafts.detErr='';save();render();toast('Details saved.')},
 getclr(){S.clearance={ref:'PRAC-TC-'+(2000+S.seq++),t:stamp()};log('System (practice)',USER.name,'Automatic tax clearance issued (practice)',S.clearance.ref);save();render();exportFile('PRACTICE-tax-clearance-'+S.clearance.ref+'.txt',clrText(),'Practice tax clearance saved.')},
 dlclr(){exportFile('PRACTICE-tax-clearance-'+S.clearance.ref+'.txt',clrText(),'Practice tax clearance saved.')},
 dlrec(){exportFile('PRACTICE-receipt-'+S.obl.ref+'.txt',recText(),'Receipt saved.')},
 nbdl(){exportFile('mohoebi-sales-notebook.csv',toCSV([['Date','Cash','MobileMoney','StockBought','Note']].concat(S.notebook.map(e=>[e.date,e.cash,e.mobile,e.stock,e.note]))),'Records saved.')},
 export(b){exportData(b.dataset.k)},
 copyclr(){copy(clrText(),'Clearance text copied.')},
 copyrec(){copy(recText(),'Receipt copied.')},
 remtoggle(b){S.remOn=b.checked;log('Trader (demo)',USER.name,b.checked?'Turned on SMS reminders':'Turned off SMS reminders','');save();render();toast(b.checked?'Reminders on.':'Reminders off.')},
 usepractice(){setData(PRACTICE,false);drafts.up={done:'Back on the practice data.'};render()},
 copycols(){copy(COLS.map(c=>c[0]+': '+c[1]).join('\n'),'File layout copied.')},
 auditcopy(){copy(S.audit.map(a=>[a.t,a.who,a.ref,a.action,a.note].join(' | ')).join('\n'),'Audit trail copied.')}
};
document.addEventListener('click',e=>{if(menuOpen&&!e.target.closest('#menu')&&!e.target.closest('[data-act=menu]')){menuOpen=false;render()}
  if(moreOpen&&!e.target.closest('.nav')){moreOpen=false;render()}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'&&b.dataset.act!=='ck'&&b.dataset.act!=='key')return;if(b.tagName==='INPUT')return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener('change',e=>{const b=e.target;if(b.tagName==='INPUT'&&b.dataset.act){const f=ACT[b.dataset.act];if(f)f(b,e)}});
const onInput=e=>{const d=e.target.dataset&&e.target.dataset.draft;if(!d)return;const i=d.indexOf('.'),g=d.slice(0,i),f=d.slice(i+1);(drafts[g]=drafts[g]||{})[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(g==='l'&&f==='q'){const pos=e.target.selectionStart;render();const n=$('#l-q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}};
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(pnl)ACT.closepanel();else if(menuOpen||moreOpen){menuOpen=false;moreOpen=false;render()}});
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
render();
</script>
